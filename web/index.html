<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e9e2d0">
<title>归山</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ui2.css">
<link rel="stylesheet" href="game.css">
</head>
<body>
<section id="title">
  <div id="title-art" class="art-fill"></div>
  <div class="title-clouds"><i></i><i></i></div>
  <div class="title-main">
    <h1>归山</h1>
    <span class="seal title-seal">留云</span>
  </div>
  <p class="title-sub">同一扇门　三次回来</p>
  <div class="title-buttons">
    <button id="btn-continue" class="choice" hidden><span>继续</span></button>
    <button id="btn-new" class="choice"><span>新游戏</span></button>
    <button id="btn-load" class="choice" hidden><span>读档</span></button>
    <div class="title-links"><button id="btn-settings" class="link">设置</button><button id="btn-debug" class="link">调试面板</button></div>
    <p id="version"></p>
  </div>
</section>

<section id="game" hidden>
  <div id="stage">
    <div id="art" class="art-fill"></div>
    <div id="inscription"></div>
    <div id="figure"></div>
  </div>
  <header class="topbar">
    <span id="chapter"></span>
    <span class="spacer"></span>
    <button id="btn-journal" class="pill">旧事录</button>
    <button id="btn-menu" class="pill">菜单</button>
  </header>
  <div id="panel" data-kind="narration">
    <div id="speaker" class="seal" hidden></div>
    <div id="text"></div>
    <div id="choices"></div>
    <div class="next">▾</div>
  </div>
</section>
<section id="hub" hidden></section>
<div id="toasts"></div>
<script src="game.js"></script>
</body>
</html>
